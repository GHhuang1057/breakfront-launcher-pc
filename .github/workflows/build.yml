name: build-pc

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Zulu + JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Ensure xvfb present
        run: command -v xvfb-run >/dev/null 2>&1 || (sudo apt-get update >/dev/null && sudo apt-get install -y xvfb)

      - name: Build (jar + Windows exe + sh + deb)
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          VERSION_TYPE: nightly

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Collect branded launcher artifacts
        run: |
          set -e
          mkdir -p out
          name="BREAKFRONT-PC-Launcher-${SHORT_SHA}"
          for ext in exe jar sh deb; do
            f=$(ls HMCL/build/libs/HMCL-*.$ext 2>/dev/null | head -1 || true)
            if [ -n "$f" ]; then cp "$f" "out/${name}.${ext}"; fi
          done
          ls -la out

      - name: Build client modpack (MC 1.21.1 / Fabric, with preset server)
        run: python3 pack/build_client_modpack.py --out out

      - name: Assemble all-in-one distribution zip
        run: |
          set -e
          name="BREAKFRONT-PC-Launcher-${SHORT_SHA}"
          rm -rf dist && mkdir -p dist/.hmcl/modpack
          cp "out/${name}.exe" dist/ 2>/dev/null || true
          cp "out/${name}.jar" dist/
          cp out/modpack.zip dist/.hmcl/modpack/modpack.zip
          {
            echo 'BREAKFRONT 破阵前线 · PC 启动器'
            echo
            echo 'Windows : 双击 BREAKFRONT-PC-Launcher-*.exe（需已安装 Java 17+）'
            echo '其它平台: java -jar BREAKFRONT-PC-Launcher-*.jar'
            echo
            echo '首次启动会自动安装 BREAKFRONT 游戏实例（含模组与预置服务器 play.geekhonize.top）。'
            echo '请勿删除 .hmcl 目录，且启动器需与 .hmcl 同目录运行。'
          } > dist/README.txt
          python3 -c "import shutil,os; shutil.make_archive('out/BREAKFRONT-PC-Launcher-'+os.environ['SHORT_SHA'], 'zip', 'dist')"
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: breakfront-launcher-pc-${{ env.SHORT_SHA }}
          path: out/*
          archive: false

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="launcher-pc-dev-${SHORT_SHA}"
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" out/* --prerelease \
            --title "BREAKFRONT PC Launcher (HMCL fork) dev ${SHORT_SHA}" \
            --notes "推荐：下载 BREAKFRONT-PC-Launcher-${SHORT_SHA}.zip（启动器 + 预置 BREAKFRONT 实例，首启自动安装）。单文件：.exe（Windows，需 Java 17+）/ .jar（跨平台）。"
