name: build-pc

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Zulu + JavaFX)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          java-package: 'jdk+fx'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Ensure xvfb present
        run: command -v xvfb-run >/dev/null 2>&1 || (sudo apt-get update >/dev/null && sudo apt-get install -y xvfb)

      - name: Build (jar + Windows exe + sh + deb)
        run: xvfb-run --auto-servernum ./gradlew build --no-daemon --parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          VERSION_TYPE: nightly

      - name: Show build outputs
        run: ls -la HMCL/build/libs

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Collect branded artifacts
        run: |
          set -e
          mkdir -p out
          name="BREAKFRONT-PC-Launcher-${SHORT_SHA}"
          for ext in exe jar sh deb; do
            f=$(ls HMCL/build/libs/HMCL-*.$ext 2>/dev/null | head -1 || true)
            if [ -n "$f" ]; then cp "$f" "out/${name}.${ext}"; fi
          done
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: breakfront-launcher-pc-${{ env.SHORT_SHA }}
          path: out/*
          archive: false

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="launcher-pc-dev-${SHORT_SHA}"
          gh release delete "${TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${TAG}" out/* --prerelease \
            --title "BREAKFRONT PC Launcher (HMCL fork) dev ${SHORT_SHA}" \
            --notes "Windows: 双击 .exe 运行（需 Java 17+，会自行查找 JRE）。跨平台: java -jar .jar。另有 .sh / .deb 供 Linux。基于 HMCL fork（BREAKFRONT 品牌 + Geekhonize 登录入口）。"
